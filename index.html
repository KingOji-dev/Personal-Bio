<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oji Great — Personal Bio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-black text-white selection:bg-white selection:text-black">

  <!-- Offscreen YouTube Player Container (200x200px so YouTube allows audio playback) -->
  <div id="yt-player-host" style="position: fixed; bottom: -300px; right: -300px; width: 200px; height: 200px; opacity: 0.01; pointer-events: none; z-index: -1;" aria-hidden="true">
    <div id="yt-player"></div>
  </div>

  <!-- Top Left Header Brand -->
  <header class="w-full px-6 sm:px-9 py-4 flex items-center justify-between z-20">
    <div class="flex items-center gap-2.5 opacity-90 hover:opacity-100 transition-opacity cursor-pointer" onclick="triggerSigilPulse()">
      <span class="font-serif-display text-lg font-bold leading-none text-white" aria-hidden="true">龙</span>
      <span class="font-serif-display text-sm tracking-wide">Oji great</span>
    </div>

    <div class="text-[11px] font-mono-code text-neutral-500 hidden sm:block tracking-widest">
      PERSONAL BIO
    </div>
  </header>

  <!-- Main Content Split Layout -->
  <main class="w-full pl-6 sm:pl-9 lg:pl-11 pr-6 sm:pr-9 lg:pr-12 py-4 flex-1 grid grid-cols-1 lg:grid-cols-12 items-center gap-10 lg:gap-4 relative">
    
    <!-- Left Column: Profile Info & Links -->
    <section class="lg:col-span-5 flex flex-col justify-center items-start z-10 pr-6 lg:pr-0">
      <div class="mb-7">
        <h1 class="font-serif-display text-6xl sm:text-7xl font-medium tracking-tight leading-none text-white">
          Oji Great
        </h1>
        <p class="font-serif-display italic text-xl sm:text-2xl text-neutral-200 mt-2 tracking-wide">
          Ayano Oji
        </p>
      </div>

      <!-- Links Table -->
      <ul class="w-full max-w-[430px] divide-y divide-transparent" id="bio-links">
        <!-- Items populated via JS -->
      </ul>
    </section>

    <!-- Right Column: Multi-Layered Rotating Arcane Sigil -->
    <section class="lg:col-span-7 flex items-center justify-center lg:justify-end relative overflow-visible">
      <div id="sigil-container" class="sigil-wrapper cursor-pointer" title="Click to resonate sigil">
        <svg id="arcane-sigil" viewBox="0 0 600 600" class="w-full h-full overflow-visible" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Circular Text Paths -->
            <path id="outer-calligraphy-path" d="M 300, 300 m -277, 0 a 277,277 0 1,1 554,0 a 277,277 0 1,1 -554,0" />
            <path id="outer-rune-path" d="M 300, 300 m -240, 0 a 240,240 0 1,1 480,0 a 240,240 0 1,1 -480,0" />
            <path id="inner-rune-path" d="M 300, 300 m -201, 0 a 201,201 0 1,1 402,0 a 201,201 0 1,1 -402,0" />
            <path id="core-script-path" d="M 300, 300 m -95, 0 a 95,95 0 1,1 190,0 a 95,95 0 1,1 -190,0" />
          </defs>

          <!-- Layer 1: Outermost Fine Ring & Cursive Script -->
          <g class="ring-outer-script">
            <circle cx="300" cy="300" r="290" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" />
            <circle cx="300" cy="300" r="286" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.5" />
            <circle cx="300" cy="300" r="269" fill="none" stroke="#ffffff" stroke-width="1.4" />
            <text fill="#ffffff" font-size="8.6" font-family="'Cormorant Garamond', serif" font-style="italic" dominant-baseline="central" opacity="0.9">
              <textPath href="#outer-calligraphy-path" startOffset="0%" textLength="1736" lengthAdjust="spacing">
                Omnia vincit silentium • Noctis aeternae custos • Umbra et lux in aeternum • Spiritus invictus • Veritas occulta • Arcanum mysteria • Silentium est aureum • Ex tenebris lux • Memento mori • Ad astra per aspera • In perpetuum •
              </textPath>
            </text>
          </g>

          <!-- Layer 2: Large Elder Futhark Rune Band -->
          <g class="ring-runes-outer">
            <circle cx="300" cy="300" r="264" fill="none" stroke="#ffffff" stroke-width="2.2" />
            <circle cx="300" cy="300" r="228" fill="none" stroke="#ffffff" stroke-width="2.2" />
            <text fill="#ffffff" font-size="23" font-family="serif" font-weight="700" dominant-baseline="central">
              <textPath href="#outer-rune-path" startOffset="0%" textLength="1503" lengthAdjust="spacing">
                ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜ
              </textPath>
            </text>
          </g>

          <!-- Layer 3: Secondary Arcane Glyphs Band -->
          <g class="ring-runes-inner">
            <circle cx="300" cy="300" r="222" fill="none" stroke="#ffffff" stroke-width="1.4" />
            <circle cx="300" cy="300" r="189" fill="none" stroke="#ffffff" stroke-width="2" />
            <text fill="#ffffff" font-size="14.5" font-family="serif" dominant-baseline="central" opacity="0.96">
              <textPath href="#inner-rune-path" startOffset="0%" textLength="1258" lengthAdjust="spacing">
                ☉☽☿♀♂♃♄⚶⚸☊☋✦✧✩✪✫✬✭✮✯✰✱✲✳✴✵✶✷✸✹✺✻✼✽✾✿❀❁❂❃❄❅☉☽☿♀♂♃♄⚶⚸☊☋✦✧✩✪✫✬✭✮✯✰✱✲✳✴✵✶✷✸
              </textPath>
            </text>
          </g>

          <!-- Layer 4: Sacred Geometry 12-Pointed Star & Outer Triangle Glyphs -->
          <g class="ring-geometry">
            <circle cx="300" cy="300" r="184" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.85" />
            <!-- 3 Interlocking Squares forming a 12-pointed star -->
            <rect x="170" y="170" width="260" height="260" fill="none" stroke="#ffffff" stroke-width="1.8" />
            <rect x="170" y="170" width="260" height="260" fill="none" stroke="#ffffff" stroke-width="1.8" transform="rotate(30 300 300)" />
            <rect x="170" y="170" width="260" height="260" fill="none" stroke="#ffffff" stroke-width="1.8" transform="rotate(60 300 300)" />
            
            <!-- 12 Arcane Glyphs placed inside the outer star points -->
            <g fill="#ffffff" font-size="11" font-family="serif" text-anchor="middle" dominant-baseline="central" opacity="0.92">
              <text x="300" y="138" transform="rotate(0 300 300)">ᛟ</text>
              <text x="300" y="138" transform="rotate(30 300 300)">ᛉ</text>
              <text x="300" y="138" transform="rotate(60 300 300)">ᚦ</text>
              <text x="300" y="138" transform="rotate(90 300 300)">ᛈ</text>
              <text x="300" y="138" transform="rotate(120 300 300)">ᛇ</text>
              <text x="300" y="138" transform="rotate(150 300 300)">ᛜ</text>
              <text x="300" y="138" transform="rotate(180 300 300)">☽</text>
              <text x="300" y="138" transform="rotate(210 300 300)">ᛏ</text>
              <text x="300" y="138" transform="rotate(240 300 300)">ᚲ</text>
              <text x="300" y="138" transform="rotate(270 300 300)">ᛊ</text>
              <text x="300" y="138" transform="rotate(300 300 300)">ᚹ</text>
              <text x="300" y="138" transform="rotate(330 300 300)">ᛃ</text>
            </g>
          </g>

          <!-- Layer 5: Core Micro-Rune Ring -->
          <g class="ring-core-script">
            <circle cx="300" cy="300" r="113" fill="none" stroke="#ffffff" stroke-width="2" />
            <circle cx="300" cy="300" r="108" fill="none" stroke="#ffffff" stroke-width="0.9" />
            <circle cx="300" cy="300" r="85" fill="none" stroke="#ffffff" stroke-width="2" />
            <text fill="#ffffff" font-size="9.5" font-family="serif" font-weight="600" dominant-baseline="central">
              <textPath href="#core-script-path" startOffset="0%" textLength="593" lengthAdjust="spacing">
                ᚠᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚠᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚠᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒ
              </textPath>
            </text>
          </g>

          <!-- Layer 6: Inner 12-Pointed Star Geometry Surrounding Center Emblem -->
          <g class="ring-inner-poly">
            <rect x="242" y="242" width="116" height="116" fill="none" stroke="#ffffff" stroke-width="1.5" />
            <rect x="242" y="242" width="116" height="116" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(30 300 300)" />
            <rect x="242" y="242" width="116" height="116" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(60 300 300)" />
          </g>

          <!-- Layer 7: Center Emblem (Dragon 龙) -->
          <g transform="translate(300, 300)">
            <circle cx="0" cy="0" r="56" fill="#000000" stroke="#ffffff" stroke-width="2.2" />
            <text
              x="0"
              y="3"
              fill="#ffffff"
              font-size="54"
              font-family="serif"
              font-weight="700"
              text-anchor="middle"
              dominant-baseline="central"
            >龙</text>
          </g>
        </svg>
      </div>
    </section>

  </main>

  <!-- Toast Notification for Copy / Actions -->
  <div id="toast-msg" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-neutral-900 border border-white/25 text-white text-xs font-mono-code px-4 py-2 rounded-full opacity-0 pointer-events-none z-50">
    COPIED TO CLIPBOARD
  </div>

  <!-- Bottom Minimalist Music Player Bar -->
  <footer class="w-full border-t border-white/15 bg-black/95 backdrop-blur-sm z-30 relative">
    <!-- Interactive Seek / Progress Line at Top of Footer -->
    <div id="progress-container" class="w-full h-[2px] bg-white/15 cursor-pointer group relative">
      <div id="progress-bar" class="h-full bg-white w-0 transition-all duration-150"></div>
    </div>

    <div class="px-5 sm:px-8 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
      
      <!-- Left: Play Button & Track Metadata -->
      <div class="flex items-center gap-3.5 w-full sm:w-auto justify-between sm:justify-start">
        <div class="flex items-center gap-3">
          <button id="play-pause-btn" aria-label="Play or Pause" class="w-8 h-8 rounded-full border border-white/40 flex items-center justify-center hover:border-white hover:bg-white hover:text-black transition-all shrink-0">
            <!-- Play Icon -->
            <svg id="icon-play" class="w-3.5 h-3.5 fill-current ml-0.5" viewBox="0 0 24 24">
              <polygon points="6,4 20,12 6,20" />
            </svg>
            <!-- Pause Icon -->
            <svg id="icon-pause" class="w-3.5 h-3.5 fill-current hidden" viewBox="0 0 24 24">
              <rect x="6" y="4" width="4" height="16" />
              <rect x="14" y="4" width="4" height="16" />
            </svg>
          </button>

          <div class="min-w-0">
            <div id="track-title" class="text-xs sm:text-[13px] font-serif-display tracking-wide text-white truncate">
              King Von - Armed & Dangerous
            </div>
            <div id="track-artist" class="text-[9px] font-mono-code tracking-[0.2em] text-neutral-400 uppercase mt-0.5 truncate">
              King Von
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Timestamp, Prev/Next Controls & Volume -->
      <div class="flex items-center gap-3 sm:gap-4 w-full sm:w-auto justify-end font-mono-code text-[10px] tracking-wider">
        <span id="time-display" class="text-neutral-300 tabular-nums">0:00 / 0:00</span>

        <div class="flex items-center gap-1.5">
          <button id="prev-btn" class="px-2.5 py-1 border border-white/25 hover:border-white hover:bg-white hover:text-black transition-colors rounded-sm">
            PREV
          </button>
          <button id="next-btn" class="px-2.5 py-1 border border-white/25 hover:border-white hover:bg-white hover:text-black transition-colors rounded-sm">
            NEXT
          </button>
        </div>

        <div class="flex items-center gap-2 pl-1">
          <button id="sound-btn" class="text-neutral-300 hover:text-white transition-colors uppercase">
            SOUND
          </button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.65" class="minimal-slider w-16 sm:w-20" aria-label="Volume" />
        </div>
      </div>

    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
